[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Non-sensitive / expected-in-bundle values. Next.js inlines process.env.* into
  # server chunks at build time; Netlify secrets scanning then fails the deploy.
  # Do not mark these as "Contains secret values" in the Netlify UI.
  #
  # CLOUDINARY_API_KEY is returned to the browser for signed uploads (see
  # cloudinary-server signUploadParams) — the real secret is CLOUDINARY_API_SECRET.
  #
  # Keep real secrets out of this list so accidental leaks still fail the build:
  # FIREBASE_ADMIN_PRIVATE_KEY(_BASE64), CLOUDINARY_API_SECRET, REVALIDATE_SECRET
  #
  # Use a long random REVALIDATE_SECRET (not 1234567890). Weak values
  # false-positive against vendor bundles (Deno std, source maps).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_DEFAULT_LOCALE,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_UPLOAD_FOLDER,ADMIN_BOOTSTRAP_EMAIL,RATE_LIMIT_MAX_PER_HOUR,FIREBASE_ADMIN_PROJECT_ID,FIREBASE_ADMIN_CLIENT_EMAIL"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache,.next/cache,.netlify/.next/server/chunks/ssr,.netlify/edge-functions,.netlify/plugins/deno-cli"

[[plugins]]
  package = "@netlify/plugin-nextjs"
